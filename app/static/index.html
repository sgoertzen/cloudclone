<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/static/assets/cloudclone.png">
<title>CloudClone</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d2330; --muted:#6a7385; --line:#e1e4ea; --accent:#2f6fed; --ok:#1f9d55; --bad:#d64545; --warn:#c98a0a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --card:#1d222b; --text:#e6e9ef; --muted:#8c95a7; --line:#2d3441; --accent:#5b8cff; --ok:#3ecf7e; --bad:#ff6b6b; --warn:#e8b339; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { font-size:18px; margin:0; }
  main { max-width:860px; min-width:0; margin:24px auto; padding:0 16px; display:grid; gap:16px; }
  .card { min-width:0; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  .muted { color:var(--muted); font-size:13px; }
  h2 { margin:0; font-size:16px; }
  button { font:inherit; padding:7px 14px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button:hover, a.btn:hover { border-color:var(--accent); }
  /* A link that looks like a default button (for navigation, e.g. "Edit"). */
  a.btn { display:inline-block; font:inherit; padding:7px 14px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--text); text-decoration:none; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--bad); }
  button:disabled { opacity:.5; cursor:default; }
  input, select { font:inherit; padding:7px 9px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--text); }
  input[type=text], input[type=password] { width:100%; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 3px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .bar { height:12px; background:var(--bg); border:1px solid var(--line); border-radius:99px; overflow:hidden; margin:10px 0 6px; }
  .bar > div { height:100%; background:var(--accent); transition:width .6s ease; }
  .bar.indet > div { width:30% !important; animation:slide 1.2s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left:-30%; } 100% { margin-left:100%; } }
  .files { font-size:12px; color:var(--muted); font-family:ui-monospace,monospace; white-space:normal; overflow-wrap:anywhere; }
  details { margin-top:10px; } summary { cursor:pointer; color:var(--accent); font-size:13px; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:10px; overflow:auto; font-size:12px; max-height:180px; white-space:pre-wrap; overflow-wrap:anywhere; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:10; padding:16px; }
  #modal .box { background:var(--card); border:1px solid var(--line); border-radius:10px; width:100%; max-width:560px; max-height:85vh; display:flex; flex-direction:column; }
  #modal .box > * { padding:14px 18px; } #modal .tree { overflow:auto; flex:1; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .node { display:flex; align-items:center; gap:6px; padding:3px 0; }
  .twisty { width:18px; cursor:pointer; color:var(--muted); user-select:none; text-align:center; }
  .hidden { display:none !important; }
  #login { max-width:340px; margin:80px auto; }
  .err { color:var(--bad); font-size:13px; min-height:18px; margin-top:8px; }
  ol { padding-left:20px; margin:6px 0; } li { margin:3px 0; }
  code { background:var(--bg); padding:1px 5px; border-radius:4px; font-size:12px; }
  nav { display:flex; gap:4px; align-items:center; }
  nav a { color:var(--muted); text-decoration:none; padding:6px 10px; border-radius:7px; }
  nav a:hover { color:var(--text); }
  nav a[aria-current=page] { color:var(--text); background:var(--bg); }
  a.button { display:inline-block; font:inherit; padding:7px 14px; border-radius:7px; border:1px solid var(--accent); background:var(--accent); color:#fff; text-decoration:none; }
  table { width:100%; border-collapse:collapse; margin-top:12px; }
  th, td { text-align:left; padding:9px 6px; border-top:1px solid var(--line); }
  th { font-size:13px; color:var(--muted); font-weight:500; }
  #user-form { max-width:420px; }
  [x-cloak] { display:none !important; }
  .syncing { color:var(--accent); }
  label.inline { margin:0; display:flex; gap:6px; align-items:center; }
  label.pick { margin:0; display:flex; gap:6px; align-items:center; color:var(--text); font-size:15px; }
  label.pick.files-only { color:var(--muted); font-size:14px; }
  code + code { margin-left:4px; }
</style>
</head>
<body x-data="app" @keydown.escape.window="picker && closePicker()">
<header>
  <h1>CloudClone</h1>
  <nav x-show="session?.authed" x-cloak aria-label="Main">
    <a href="#/" :aria-current="view === 'backups' ? 'page' : null">Backups</a>
    <a href="#/users" :aria-current="view !== 'backups' ? 'page' : null">Users</a>
    <span class="muted" style="margin:0 8px 0 12px" x-text="me?.username"></span>
    <button @click="logout()">Log out</button>
  </nav>
</header>

<!-- ---- login / first-run setup ---- -->
<form id="login" class="card" x-show="session && !session.authed" x-cloak @submit.prevent="submitLogin()">
  <h2 x-text="session?.configured ? 'Log in' : 'Create the first account'"></h2>
  <p class="muted" x-show="!session?.configured">First run: choose a username and a password (8+ characters) to protect this page.</p>
  <label for="un">Username</label>
  <input type="text" id="un" x-ref="username" x-model="login.username" autocomplete="username" autocapitalize="none">
  <label for="pw">Password</label>
  <input type="password" id="pw" x-model="login.password" aria-describedby="login-err"
         :autocomplete="session?.configured ? 'current-password' : 'new-password'">
  <div class="err" id="login-err" role="alert" x-text="login.err"></div>
  <button class="primary" type="submit" x-text="session?.configured ? 'Continue' : 'Create account'"></button>
</form>

<!-- ---- backups ---- -->
<main x-show="session?.authed && view === 'backups'" x-cloak>
  <template x-if="st">
    <div style="display:contents">
      <div class="card muted" x-show="!st.accounts.length">No accounts yet. Add a Google account below.</div>

      <template x-for="a in st.accounts" :key="a.id">
        <div class="card" x-data="accountCard">
          <div class="row">
            <div class="grow">
              <h2><span x-text="a.name"></span> <span class="badge" :class="status(a).cls" x-text="status(a).text"></span></h2>
              <div class="muted"><span x-text="a.email"></span> → <code x-text="a.destination"></code></div>
            </div>
            <button class="primary" x-show="a.connected" @click="runNow(a.id)" :disabled="isRunning(a) || isQueued(a)"
                    :aria-label="'Run backup for ' + a.name">Run now</button>
            <button class="primary" x-show="!a.connected" @click="connect()">Connect Google</button>
            <button class="danger" x-show="isRunning(a)" @click="cancelRun()" aria-label="Cancel backup">Cancel</button>
          </div>

          <template x-if="prog">
            <div>
              <div class="bar" :class="{ indet: prog.scanning }"><div :style="{ width: prog.pct + '%' }"></div></div>
              <div class="muted"><span x-text="prog.label"></span><span x-show="prog.errors"> · <span class="bad" x-text="prog.errors + ' errors'"></span></span></div>
              <div class="files" x-show="prog.files.length"><template x-for="f in prog.files"><div x-text="f"></div></template></div>
              <pre x-show="prog.log" x-text="prog.log"></pre>
            </div>
          </template>
          <template x-if="!prog && a.last_run">
            <div class="muted">
              Last run: <span x-text="lastRunText(a.last_run)"></span>
              <div class="bad" x-show="a.last_run.error" x-text="a.last_run.error"></div>
            </div>
          </template>

          <div class="muted" style="margin-top:8px" x-text="scheduleLine(a)"></div>

          <details>
            <!-- Reset the form to the saved settings when opening (click fires before the panel opens). -->
            <summary @click="!$el.parentElement.open && resetDraft()">Settings</summary>
            <div class="row" style="margin-top:8px">
              <select x-model="draft.freq" aria-label="Select backup frequency">
                <option>daily</option><option>weekly</option><option>monthly</option>
              </select>
              <select x-show="draft.freq === 'weekly'" x-model.number="draft.weekday" aria-label="Select backup day of week">
                <template x-for="(d, i) in days" :key="i"><option :value="i" x-text="d"></option></template>
              </select>
              <select x-show="draft.freq === 'monthly'" x-model.number="draft.monthday" aria-label="Select backup day of month">
                <template x-for="n in 28" :key="n"><option :value="n" x-text="n"></option></template>
              </select>
              <input type="time" x-model="draft.time" aria-label="Select backup time">
              <label class="inline"><input type="checkbox" x-model="draft.enabled"> enabled</label>
              <button @click="saveSchedule()" aria-label="Save backup settings">Save</button>
            </div>
            <div class="row" style="margin-top:10px" x-show="a.connected">
              <div class="grow"><b>Folders:</b>
                <template x-for="f in a.folders" :key="f"><code x-text="f"></code></template>
                <span class="muted" x-show="!a.folders.length">Entire Drive</span>
              </div>
              <button @click="openPicker(a)" aria-label="Choose folders for backup">Choose folders…</button>
            </div>
            <div class="row" style="margin-top:10px">
              <button x-show="a.connected" @click="connect()" aria-label="Re-connect Google account">Re-connect Google</button>
              <button class="danger" @click="deleteAccount(a)" aria-label="Delete account">Delete account</button>
              <span class="muted">Deleting keeps already-backed-up files on disk. Backup is an exact mirror: files removed from Drive are removed from the backup on the next run.</span>
            </div>
          </details>

          <!-- Paste-back Google sign-in, used when PUBLIC_URL isn't set. -->
          <template x-if="authUrl">
            <form style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px" @submit.prevent="submitCode()">
              <ol class="muted">
                <li><a :href="authUrl" target="_blank" rel="noopener">Open Google sign-in</a> and approve read-only access.</li>
                <li>Your browser will then land on a page that fails to load (<code>127.0.0.1:53682</code>). That's expected.</li>
                <li>Copy the <b>entire URL</b> from the address bar and paste it here:</li>
              </ol>
              <input type="text" x-model="code" x-init="$nextTick(() => $el.focus())"
                     placeholder="http://127.0.0.1:53682/?state=...&code=..." aria-label="Paste Google authentication URL">
              <div class="err" role="alert" x-text="authErr"></div>
              <button class="primary" type="submit">Finish</button>
            </form>
          </template>
        </div>
      </template>

      <div class="card">
        <div class="row">
          <h2 class="grow">Add Google account</h2>
          <button @click="addOpen = !addOpen" :aria-expanded="addOpen.toString()" aria-controls="add-form">Add…</button>
        </div>
        <form id="add-form" x-show="addOpen" @submit.prevent="createAccount()">
          <details open>
            <summary>How to get a Client ID &amp; Secret (one-time, ~5 min)</summary>
            <ol class="muted">
              <li>Open <b><a href="https://console.cloud.google.com" target="_blank" rel="noopener">console.cloud.google.com</a></b>, create a project, and enable the <b>Google Drive API</b>.</li>
              <li><b><a href="https://console.cloud.google.com/auth/clients" target="_blank" rel="noopener">Create OAuth Client</a></b>: choose Desktop application.</li>
              <li x-show="st.direct_oauth"><b>Credentials → Create credentials → OAuth client ID</b> → type <b>Web application</b>, with Authorized redirect URI <code x-text="st.redirect_uri"></code>.</li>
              <li x-show="!st.direct_oauth"><b>Credentials → Create credentials → OAuth client ID</b> → type <b>Desktop app</b>.</li>
              <li>Paste the Client ID and Secret below. The container only ever requests <b>read-only</b> Drive access.</li>
            </ol>
          </details>
          <label for="a-name">Name (also the backup sub-folder)</label>
          <input type="text" id="a-name" x-model="add.name" placeholder="personal">
          <div x-show="!st.has_default_client || ownCreds">
            <label for="a-cid">Client ID</label><input type="text" id="a-cid" x-model="add.client_id">
            <label for="a-secret">Client Secret</label><input type="password" id="a-secret" x-model="add.client_secret">
            <label class="inline" style="margin-top:10px"><input type="checkbox" x-model="add.save_as_default"> Save as default for future accounts</label>
          </div>
          <div class="muted" x-show="st.has_default_client && !ownCreds">
            Using the saved Client ID &amp; Secret. <a href="#" @click.prevent="ownCreds = true">Use different ones</a>
          </div>
          <label for="a-team">Shared Drive ID (optional — leave blank for My Drive)</label>
          <input type="text" id="a-team" x-model="add.shared_drive_id">
          <div class="err" role="alert" x-text="addErr"></div>
          <button class="primary" type="submit" aria-label="Create new account">Create</button>
        </form>
      </div>
    </div>
  </template>
</main>

<!-- ---- users ---- -->
<main x-show="session?.authed && view === 'users'" x-cloak>
  <div class="card">
    <div class="row"><h2 class="grow">Users</h2><a class="button" href="#/users/new">New user</a></div>
    <table>
      <thead><tr><th scope="col">Username</th><th scope="col"><span class="hidden">Actions</span></th></tr></thead>
      <tbody>
        <tr x-show="!users && !usersErr"><td colspan="2" class="muted">Loading…</td></tr>
        <tr x-show="usersErr"><td colspan="2" class="err" x-text="usersErr"></td></tr>
        <template x-for="u in users || []" :key="u.id">
          <tr>
            <td><span x-text="u.username"></span> <span class="muted" x-show="u.id === me?.id">(you)</span></td>
            <td style="text-align:right">
              <a class="btn" :href="'#/users/' + encodeURIComponent(u.id)" :aria-label="'Edit ' + u.username">Edit</a>
              <button class="danger" style="margin-left:8px" x-show="u.id !== me?.id" @click="deleteUser(u)"
                      :aria-label="'Delete ' + u.username">Delete</button>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</main>

<main x-show="session?.authed && view === 'user-form'" x-cloak>
  <form class="card" id="user-form" @submit.prevent="saveUser()">
    <p style="margin:0 0 8px"><a href="#/users" style="color:var(--accent)">← All users</a></p>
    <h2 x-text="uf.id ? 'Edit user' : 'New user'"></h2>
    <label for="uf-username">Username</label>
    <input type="text" id="uf-username" x-ref="ufUsername" x-model="uf.username" autocomplete="off" autocapitalize="none">
    <label for="uf-password" x-text="uf.id ? 'New password (leave blank to keep the current one)' : 'Password (8+ characters)'"></label>
    <input type="password" id="uf-password" x-model="uf.password" autocomplete="new-password">
    <label for="uf-confirm">Confirm password</label>
    <input type="password" id="uf-confirm" x-model="uf.confirm" autocomplete="new-password">
    <div class="err" role="alert" x-text="uf.err"></div>
    <div class="row">
      <button class="primary" type="submit" :disabled="uf.loading" x-text="uf.id ? 'Save changes' : 'Create user'"></button>
      <a href="#/users" class="grow" style="color:var(--muted)">Cancel</a>
      <button type="button" class="danger" x-show="uf.id && uf.id !== me?.id"
              @click="deleteUser({ id: uf.id, username: uf.username })">Delete user</button>
    </div>
  </form>
</main>

<footer class="muted" style="text-align:center;padding:16px" role="contentinfo" x-text="st ? 'CloudClone v' + st.version : ''"></footer>

<!-- ---- folder picker ---- -->
<div id="modal" x-show="picker" x-cloak role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <template x-if="picker">
    <div class="box">
      <div>
        <h2 id="modal-title">Choose folders to back up</h2>
        <div class="muted">Pick top-level or nested folders. Selecting a folder includes everything inside it; "files only" includes just the files directly in that folder. Leave nothing selected to back up the whole Drive.</div>
      </div>
      <div class="tree">
        <template x-for="row in pickerRows" :key="row.key">
          <div :style="{ marginLeft: row.depth * 22 + 'px' }">
            <template x-if="row.type === 'folder'">
              <div class="node">
                <span class="twisty" @click="toggleOpen(row.path)" x-text="picker.open[row.path] ? '▾' : '▸'"></span>
                <label class="pick"><input type="checkbox" :checked="covered(row.path)" :disabled="folderLocked(row.path)"
                       @change="pickFolder(row.path, $event.target.checked)"> <span x-text="row.name"></span></label>
              </div>
            </template>
            <template x-if="row.type === 'files'">
              <div class="node">
                <span class="twisty"></span>
                <label class="pick files-only"><input type="checkbox" :checked="filesChecked(row.path)" :disabled="filesLocked(row.path)"
                       @change="pickFiles(row.path, $event.target.checked)"> <span x-text="row.label"></span></label>
              </div>
            </template>
            <template x-if="row.type === 'msg'"><div class="muted" x-text="row.text"></div></template>
            <template x-if="row.type === 'err'"><div class="err" x-text="row.text"></div></template>
          </div>
        </template>
      </div>
      <div class="row">
        <span class="muted grow" aria-live="polite"
              x-text="picker.selected.length ? picker.selected.length + ' folder(s) selected' : 'Entire Drive'"></span>
        <button @click="closePicker()" aria-label="Cancel folder selection">Cancel</button>
        <button class="primary" @click="savePicker()" aria-label="Save folder selection">Save</button>
      </div>
    </div>
  </template>
</div>

<script src="/static/assets/index.js"></script>
<script defer src="/static/vendor/alpine-3.14.9.min.js"></script>
</body>
</html>
